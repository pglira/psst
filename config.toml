# psst configuration

[whisper]
# Path to whisper.cpp model file (ggml format).
# Download from: https://huggingface.co/ggerganov/whisper.cpp/tree/main
# Leave empty to auto-download the model specified by 'model_size'.
model_path = ""

# Model size: tiny, base, small, medium, large-v3
model_size = "small"

# Language code (e.g. "en", "de", "auto" for auto-detect)
language = "auto"

# Enable translate mode (translate to English)
translate = false

# Number of processing threads (0 = auto)
threads = 0

# Text that biases the transcription style. Punctuated text such as
# "Note: first – second; third (optional)." makes Whisper punctuate more.
# Empty = no prompt.
initial_prompt = ""

[punctuation]
# Replace spoken commands (e.g. "colon", "Doppelpunkt") with symbols.
# Built-in commands:
#   English: period, full stop, comma, colon, semicolon, question mark,
#            exclamation mark, exclamation point, dash, hyphen, new line,
#            newline, new paragraph, open/close bracket, open/close parenthesis
#   German:  Punkt, Komma, Doppelpunkt, Semikolon, Strichpunkt, Fragezeichen,
#            Ausrufezeichen, Gedankenstrich, Bindestrich, neue Zeile,
#            neuer Absatz, Klammer auf, Klammer zu
# Built-in edit commands:
#   English: delete word, delete last word, delete sentence, delete last sentence
#   German:  Wort löschen, letztes Wort löschen, Satz löschen,
#            letzten Satz löschen
# false disables all spoken commands.
enabled = true

[punctuation.words]
# Add or override commands: "spoken phrase" = "inserted text".
# The inserted text includes its spacing, e.g. ": " or " (".
# An empty value disables a built-in command.
# The values "<delete-word>" and "<delete-sentence>" make edit commands.
# "slash" = "/"
# "scratch that" = "<delete-sentence>"
# "Punkt" = ""

[stream]
# Type text while you speak: each utterance is transcribed and typed when
# you pause. false = type all text after the recording stops.
enabled = true

# Silence in milliseconds that ends an utterance.
pause_ms = 600

# Utterances longer than this (milliseconds) are split at a quiet point.
max_utterance_ms = 20000

[gpu]
# Use GPU acceleration (requires CUDA build)
enabled = true

# GPU device index (0 = first GPU)
device = 0

[hotkey]
# Keybinding to toggle recording.
# Format: modifier+key (e.g. "super+v", "ctrl+shift+v")
bind = "super+v"

[output]
# Also copy transcribed text to the system clipboard
copy_to_clipboard = false

[inject]
# Inter-keystroke delay in milliseconds when typing the transcript.
# 0 = instant (may drop chars in some apps). 12 = xdotool's default (reliable).
# Only applies on X11; on Wayland wtype uses its native pace.
type_delay_ms = 12

[audio]
# PulseAudio source name (empty = default microphone)
device = ""

# Sample rate in Hz (16000 required by whisper, PulseAudio resamples automatically)
sample_rate = 16000

